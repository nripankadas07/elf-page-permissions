[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "elf-page-permissions"
version = "0.1.0"
description = "Explain ELF LOAD ranges, zero-fill and declared page-permission unions without executing a binary."
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []
[project.scripts]
elf-page-permissions = "elf_page_permissions:main"
[tool.setuptools]
py-modules = ["elf_page_permissions"]
